backend:
  name: git-gateway
  commit_messages:
    create: "add {{collection}} “{{slug}}”"
    update: "update {{collection}} “{{slug}}”"
    delete: "delete {{collection}} “{{slug}}”"
    uploadMedia: "upload “{{path}}”"
    deleteMedia: "delete “{{path}}”"

local_backend:
  url: http://localhost:8081/api/v1

media_folder: static/img
public_folder: img
collections:
  - name: blog
    label: Blog
    folder: "content/blog"
    create: true
    fields:
      - {
          label: "Título",
          name: "title",
          widget: "string",
          pattern: [".{24,}", "Must have at least 24 characters"],
        }
      - { label: "Data de publicação", name: "date", widget: "datetime" }
      - { label: "Imagem", name: "featuredimage", widget: image }
      - {
          label: "Descrição",
          name: "description",
          widget: "string",
          hint: "Resumo do post em uma ou duas frases (50 a 160 caracteres). É o texto que aparece no Google e ao compartilhar o link.",
          pattern: [".{50,}", "Escreva pelo menos 50 caracteres"],
        }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: receitas
    label: Receitas
    folder: "content/recipes"
    create: true
    editor:
      preview: false
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data de publicação", name: "date", widget: "datetime" }
      - { label: "Imagem", name: "featuredimage", widget: image }
      - {
          label: "Categoria",
          name: "category",
          widget: "select",
          options:
            [
              "Bolos e tortas",
              "Carnes",
              "Peixes e frutos do mar",
              "Saladas e molhos",
              "Sopas",
              "Massas",
              "Bebidas",
              "Sobremesas",
              "Lanches",
            ],
        }
      - { label: "Conteúdo", name: "body", widget: "markdown" }

  - name: ebooks
    label: eBooks
    folder: "content/ebooks"
    path: "{{slug}}/index"
    media_folder: ""
    create: true
    editor:
      preview: false
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Capa", name: "cover", widget: image }
      - { label: "Sumário", name: "body", widget: "markdown" }
      - { label: "Arquivo", name: "file", widget: file, allow_multiple: false }
      - { label: "Data de publicação", name: "date", widget: "datetime" }
